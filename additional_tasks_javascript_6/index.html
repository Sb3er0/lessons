<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Задача №6</title>
	<script>
		//Задача №6 - Даны три действительные переменные a, b и c. Составить алгоритм, который меняет местами значения этих переменных следующим образом: переменная a получает значение b, переменная b получает значение c, а переменная c — предыдущее значение a.

		//Первый товар
		let a = parseFloat(prompt(`Введите значение переменной "a":`, 5.54));
		let b = parseFloat(prompt(`Введите значение переменной "b":`, -15.2));
		let c = parseFloat(prompt(`Введите значение переменной "c":`, 10.8));

		//Константы

		//Расчёты

		//Вывод результатов
		document.write(`
			<h2>Исходные переменные:</h2>
			<ul>
				<li>Переменная "a": ${a}</li>
				<li>Переменная "b": ${b}</li>
				<li>Переменная "c": ${c}</li>
			</ul>
			<br>
			<h2>Ухаха я чорт, я поменял местами переменные!</h2>
			<ul>
				<li>Переменная "a": ${b}</li>
				<li>Переменная "b": ${c}</li>
				<li>Переменная "c": ${a}</li>
			</ul>
		`);
	</script>
</head>
<body></body>
</html>
