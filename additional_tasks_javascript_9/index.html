<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Задача №9</title>
	<script>
		//Задача №9 - Составить программу для задачи: идёт N-я секунда суток, определить сколько полных часов и полных минут прошло до этого момента.

		//Ввод данных
		let x = parseInt(prompt(`Введите значение переменной "x":`, 18000));

		//Константы
		const SECONDS_IN_MINUTE = 60; //Количество секунд в одной минуте
		const SECONDS_IN_HOUR = 3600; //Количество секунд в одном часе
		
		//Расчёты
		let a = Math.floor(x / SECONDS_IN_MINUTE); //Количество полных часов
		let b = Math.floor(x / SECONDS_IN_HOUR); //Количество полных минут
		let c = Math.floor((x % SECONDS_IN_HOUR) / SECONDS_IN_MINUTE); //Количество полных минут не включая полные часы
		//Вывод результатов
		document.write(`
			<ul>
				<li>Прошло ${x} секунд с начала суток</li>
				<li>Прошло ${a} минут с начала суток</li>
				<li>Прошло ${b} часов с начала суток</li>
				<li>Прошло ${b} часов ${c} минут после последнего часа</li>
			</ul>
		`);
	</script>
</head>
<body></body>
</html>
