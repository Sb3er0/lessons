<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Задача №1</title>
	<script>
		let a = parseFloat(prompt(`Введите значение "а":`, 7));
		let b = parseFloat(prompt(`Введите последнее значение "b":`, 7));
		let sum = a + b;
		let multiplication = a * b;
		let division = a / b;
		document.write(`
			<table style="border:1px solid black; border-radius: 5px; min-width: 200px; max-width: 500px;">
				<tr>
					<td>Сумма результатов:</td>
					<td>${sum}</td>
				</tr>
				<tr>
					<td>Умножение результата:</td>
					<td>${multiplication}</td>
				</tr>
				<tr>
					<td>Деление результата:</td>
					<td>${division}</td>
				</tr>
			</table>
		`);
	</script>
</head>
<body></body>
</html>
