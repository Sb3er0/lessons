<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Задача №5</title>
	<script>
		let sec = parseInt(prompt(`Введите количество секунд, прошедших с начала суток:`, 60));
		let minutes = sec / 60;
		let hours = minutes / 60;
		document.write(`
			<ul>
				<li>Это равняется - ${minutes} м.</li>
				<li>Это равняется - ${hours} ч.</li>
			</ul>
		`);
	</script>
</head>
<body></body>
</html>
