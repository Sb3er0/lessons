<!doctype html>
<html lang="en">
	<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Задача №6</title>
	<script>
		let name = prompt(`Введите Ваше ФИО:`, `Иванов Иван Иванович`);
		let cost = parseFloat(prompt(`Стоимость курса?`, 12000));
		let number = parseInt(prompt(`На сколько человек курс?`, 3));
		let sum = cost * number;
		document.write(`
			<h3>Чек об оплате</h3>
			<h4>Курс по "JavaScript" от "Фрилансер по жизни"</h4>
			<h5>${name}</h5>
			<p>Курс по JavaScript 1 шт. - ${cost} грн.</p>
			<p>Общая стоимость за ${number} шт. - ${sum} грн.</p>
			<p>Спасибо за покупку! Приходите ещё!</p>
			<p>При предъявлении этого чека на следующую покупку действует скидка 20%.</p>
		`);
	</script>
</head>
<body></body>
</html>
