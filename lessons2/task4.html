<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Задача №4</title>
	<script>
		let length = parseFloat(prompt(`Введите длину в сантиметрах для дальнейшего расчёта:`, 100));
		let meters = length / 100;
		let kilometers = length / 1000;
		document.write(`
			<ul>
				<li>Это равняется - ${meters} м.</li>
				<li>Это равняется - ${kilometers} км.</li>
			</ul>
		`);
	</script>
</head>
<body></body>
</html>
